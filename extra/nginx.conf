server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    # Increase header buffer size
    large_client_header_buffers 4 32k;

    # Increase the maximum allowed size of the client request body
    client_body_buffer_size 32k;

    # Increase the maximum allowed size of the client request header fields
    client_header_buffer_size 32k;

    # NextJS Revalidation 
    location /api/revalidate {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next Auth
    location /api/auth {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Backend API
    location /api/v1 {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Static Content
    location /content {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # After auth, redirect back to the last page the user visited (tracked via cookie)
    location = /redirect_from_auth {
        # Extract last path from cookie; default to root
        set $return_to "/";
        if ($http_cookie ~* "learnhouse_return_to=([^;]+)") { set $return_to $1; }
        return 302 $return_to;
    }

    # Frontend
    location / {
        # Track last visited non-auth path to enable post-login return
        # Exclude: api, auth, _next, content, fonts, umami, examples, and auth pages (login, signup, forgot, reset)
        if ($request_uri !~* ^/(api|auth|_next|content|fonts|umami|examples|login|signup|forgot|reset)(/|$|\?)) {
            add_header Set-Cookie "learnhouse_return_to=$request_uri; Path=/; SameSite=Lax" always;
        }

        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}